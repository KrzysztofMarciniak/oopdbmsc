name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KrzysztofMarciniak/oopdbms
          path: oopdbms

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format pkg-config

      - name: Install OOPDBMS engine
        run: make -C oopdbms install PREFIX="$HOME/.local"

      - name: Configure pkg-config
        run: echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Check formatting
        run: |
          make -C oopdbms format-check
          make format-check

      - name: Build and test
        run: |
          make test
          make all
          make quick_start QUICK_START_DB="$RUNNER_TEMP/quick-start.oopdb"

      - name: Verify installed consumer
        run: |
          prefix="$RUNNER_TEMP/oopdbmsc-install"
          make install PREFIX="$prefix"
          cc -std=c99 -I"$prefix/include" examples/main.c \
            "$prefix/lib/liboopdbmsc.a" \
            $(pkg-config --static --libs oopdbms-engine) \
            -Wl,-rpath,"$HOME/.local/lib" \
            -o "$RUNNER_TEMP/installed-consumer"
          "$RUNNER_TEMP/installed-consumer" \
            "$RUNNER_TEMP/installed-consumer.oopdb"
